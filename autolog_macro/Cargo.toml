[package]
name = "frc_autolog_macro"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Proc-macros for the robot-rust project."
homepage = "https://github.com/carsonetb/robot-rust"
repository = "https://github.com/carsonetb/robot-rust"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3.5.0"
