[package]
name = "robot-rust"
version = "0.1.0"
edition = "2024"

[build-dependencies]
bindgen = "0.73.2"
autocxx-build = "0.27"
miette = { version = "5.10", features = ["fancy"] }

[dependencies]
autocxx = "0.30.0"
cxx = "1.0.202"
autolog_macro = { path = "./autolog_macro" }
uom = "0.38.0"
bevy_ecs = "0.20.0"
num-traits = "0.2.19"
num-derive = "0.5.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"
