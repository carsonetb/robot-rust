[package]
name = "robot-rust"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "The robot-rust project, bindings for wpilib, ctre, and rev in rust."
homepage = "https://github.com/carsonetb/robot-rust"
repository = "https://github.com/carsonetb/robot-rust"
exclude = ["*.so", "*.so.*"]

[build-dependencies]
bindgen = "0.73.2"
autocxx-build = "0.27"
miette = { version = "5.10", features = ["fancy"] }
reqwest = { version = "0.11", features = ["blocking"] }
zip = "0.6"
home = "0.5"

[dependencies]
autocxx = "0.30.0"
cxx = "1.0.202"
frc_autolog_macro = "0.1"
uom = "0.38.0"
bevy_ecs = { version = "0.20.0", features = ["debug"] }
num-traits = "0.2.19"
num-derive = "0.5.1"
derive_more = { version = "2.1.1", features = ["full"] }
nalgebra = "0.35.0"
ordered-float = "5.5.0"
num_enum = "0.7.6"
glam = "0.34.1"
libc = "0.2.191"
rand = "0.10.3"
rand_distr = "0.6.0"

[profile.dev]
debug = true

[profile.release]
debug = true
strip = "none"

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"
